name: Auto Merge Development PRs

on:
  pull_request:
    branches:
      - development
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed('No pull request found in the event payload.');
              return;
            }

            if (pr.base.ref !== 'development') {
              core.info(`Skipping auto-merge because base branch is ${pr.base.ref}.`);
              return;
            }

            const { owner, repo } = context.repo;

            await github.graphql(`
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }
            `, {
              pullRequestId: pr.node_id
            });

            core.info(`Auto-merge enabled for #${pr.number} in ${owner}/${repo}.`);
